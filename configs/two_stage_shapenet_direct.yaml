# Stage-3 DIRECT-REGRESSION diagnostic config.
#
# Replaces correspondence+Kabsch with direct per-fragment SE(3) regression
# (model.pose.architecture: "direct_regression"). Keeps ORIGINAL Stage-1/2
# capacity (num_tokens=16, decoder_layers=2) so the existing
# outputs_two_stage_shapenet/stage2_assembly.pt loads, and writes to a separate
# output dir. Use for `--mode stage3-train-gt` / `stage3-gt` with
# --stage2-checkpoint outputs_two_stage_shapenet/stage2_assembly.pt

mock_data:
  enabled: false

data:
  shapenet_root: "./shape_processed"
  categories:
    - "02691156"
    - "02828884"
    - "02933112"
    - "02958343"
    - "03001627"
    - "03211117"
    - "03636649"
    - "03691459"
    - "04256520"
    - "04379243"
  num_points_per_object: 4096
  num_points_per_fragment: 1024
  train_split: 0.80
  val_split: 0.10
  test_split: 0.10
  seed: 42

fragment:
  min_fragments: 3
  max_fragments: 6
  strategies: ["plane", "voronoi", "irregular"]
  boundary_eps: 0.04
  irregular_noise_scale: 0.05

pairs:
  positive_ratio: 0.5
  easy_negative_ratio: 0.2
  hard_negative_ratio: 0.2
  perturbed_positive_ratio: 0.1
  perturb_jitter_std: 0.03
  perturb_anisotropic_scale: 0.12

augmentation:
  random_fragment_rotation: true
  fragment_pose_translation: 0.7

model:
  encoder:
    type: "se3_invariant"
    embedding_dim: 128
    hidden_dim: 192
    num_tokens: 16       # ORIGINAL — matches existing checkpoints
    num_neighbors: 16
    dropout: 0.05
  compatibility:
    hidden_dims: [256, 192]
    edge_dim: 128
    dropout: 0.05
  assembly:
    gnn_hidden_dim: 256
    gnn_layers: 3
    transformer_layers: 2
    transformer_heads: 4
    decoder_layers: 2    # ORIGINAL — must match existing stage2_assembly.pt
    output_points: 4096
    dropout: 0.05
  pose:
    architecture: "direct_regression"
    hidden_dim: 256
    head_hidden_dim: 256
    num_heads: 4
    cross_attention_layers: 2
    transformer_layers: 2
    dropout: 0.05
    freeze_encoders: true

loss:
  stage1:
    lambda_contrast: 0.5
    temperature: 0.07
    pos_weight: 1.0
    lambda_boundary: 0.0
  stage2:
    lambda_boundary: 2.0
    lambda_coverage: 1.0
    lambda_dropout: 0.5
    lambda_consistency: 0.3
    lambda_compat: 0.1
    boundary_weight: 2.0
    dropout_margin: 0.01
  stage3:
    # Direct regression: chordal rotation + translation dominate; Chamfer aux.
    lambda_pose: 8.0
    lambda_recon: 1.0
    lambda_coverage: 0.5
    lambda_gt: 0.5
    lambda_overlap: 0.05
    overlap_threshold: 0.03

stage1:
  epochs: 50
  epoch_size: 20000
  batch_size: 16
  num_workers: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip: 1.0

stage2:
  epochs: 80
  epoch_size: 10000
  batch_size: 4
  num_workers: 4
  learning_rate: 0.0001
  pretrained_learning_rate: 0.00001
  weight_decay: 0.0001
  gradient_clip: 1.0
  freeze_pretrained: true
  unfreeze_pretrained_epoch: 20

stage3:
  epochs: 30
  epoch_size: 1024
  batch_size: 1
  grad_accum_steps: 4
  num_workers: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip: 1.0
  pose_only_epochs: 5
  geometry_epochs: 10
  initialization_icp_iterations: 0
  icp_iterations: 0

output:
  dir: "./outputs_stage3_direct"
