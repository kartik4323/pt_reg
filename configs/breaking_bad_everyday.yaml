# Breaking Bad, vanilla `everyday` subset, 2-20 parts.
#
# Stage 1: pairwise FRACTURE-SURFACE compatibility (real fracture surfaces exist in
#          this dataset, unlike our old synthetic surface cuts).
# Stage 2: a deliberately COARSE occupancy prior generated from unposed fragments
#          (the research novelty), via an implicit coordinate-queried decoder so the
#          target-fidelity ablation is free from a single trained model.
# Stage 3: to be built (occupancy-scored placement + fracture-surface refinement).
#
# Prepare data first:
#   1) Borealis Dataverse DOI 10.5683/SP3/LZNPKB -> everyday_compressed.zip + data_split.tar.gz
#   2) python decompress.py --data_root <raw> --subset everyday   (needs igl, gpytoolbox==0.2.0)
#   3) python scripts/get_breaking_bad_data.py --raw-root <raw> \
#        --output-root ./breaking_bad_processed --subset everyday \
#        --sampling fixed_per_fragment --points-per-fragment 1000 --occupancy-resolution 32

mock_data:
  enabled: false

data:
  # NOTE: the key is still `shapenet_root` because five call sites hard-code it;
  # it means "dataset root" and points at the processed Breaking Bad output.
  shapenet_root: "./breaking_bad_processed"
  dataset: "breaking_bad"
  subset: "everyday"
  num_points_per_fragment: 1000     # baseline / PuzzleFusion++ convention
  num_points_per_object: 5000
  seed: 42

fragment:
  # Breaking Bad everyday multi-part protocol: 2-20 pieces.
  min_fragments: 2
  max_fragments: 20

pairs:
  positive_ratio: 0.5
  hard_negative_ratio: 0.25

augmentation:
  # Protocol-critical: rotation ONLY. Each fragment is recentred to its own
  # centroid and the GT translation IS that centroid -- Breaking Bad applies no
  # random translation, so anything else is not comparable to published numbers.
  random_fragment_rotation: true

model:
  encoder:
    type: "se3_invariant"
    embedding_dim: 128
    hidden_dim: 192
    num_tokens: 32
    num_neighbors: 16
    dropout: 0.05
  compatibility:
    hidden_dims: [256, 192]
    edge_dim: 128
    dropout: 0.05
  assembly:
    gnn_hidden_dim: 256
    gnn_layers: 3
    transformer_layers: 2
    transformer_heads: 4
    decoder: "occupancy"            # <- the coarse volumetric prior
    decoder_layers: 3
    occupancy_resolution: 32        # default inference grid; a runtime argument
    occupancy_num_freqs: 6
    occupancy_train_queries: 4096   # training cost is independent of resolution
    output_points: 4096             # points sampled from the predicted surface
    dropout: 0.05
  pose:
    # Stage 3 is not built yet; classical registration is the working stand-in and
    # needs no checkpoint, so eval/inference run today.
    architecture: "classical"
    classical_method: "auto"
    voxel: 0.05

loss:
  stage1:
    lambda_contrast: 0.5
    temperature: 0.07
    pos_weight: 1.0
    # Now meaningful: fragment_boundary holds REAL fracture-surface labels.
    lambda_boundary: 1.0
  stage2:
    lambda_iou: 1.0                 # soft IoU alongside BCE
    lambda_confidence: 0.1          # confidence must predict its own correctness
    lambda_compat: 0.1              # preserve Stage-1 scores
    lambda_dropout: 0.5
    lambda_consistency: 0.3
    dropout_margin: 0.01
    # occupancy_pos_weight: 3.0     # set if the empty/occupied imbalance hurts
  stage3: {}

stage1:
  epochs: 40
  epoch_size: 20000
  batch_size: 16
  num_workers: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip: 1.0

stage2:
  epochs: 80
  epoch_size: 10000
  batch_size: 4
  num_workers: 4
  learning_rate: 0.0001
  pretrained_learning_rate: 0.00001
  weight_decay: 0.0001
  gradient_clip: 1.0
  freeze_pretrained: true
  unfreeze_pretrained_epoch: 20

stage3:
  epoch_size: 256                   # classical registration is ~seconds/fragment
  batch_size: 1
  num_workers: 0
  initialization_icp_iterations: 0
  icp_iterations: 0

output:
  dir: "./outputs_breaking_bad"
