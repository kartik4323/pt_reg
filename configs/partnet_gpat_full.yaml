# Full PartNet/GPAT study.  Keep the same data protocol as the pilot; only
# training budgets change.  Run it through scripts/run_experiment.py on the VM.
mock_data:
  enabled: false

data:
  dataset: "gpat_partnet"
  shapenet_root: "./partnet_gpat_processed"
  manifest: "manifest.json"
  categories: ["chair", "lamp", "faucet", "table", "display"]
  num_points_per_object: 5000
  num_points_per_fragment: 1000
  contact_threshold: 0.01
  seed: 42

fragment:
  min_fragments: 2
  max_fragments: 20

pairs:
  positive_ratio: 0.50
  easy_negative_ratio: 0.25
  hard_negative_ratio: 0.25

augmentation:
  random_fragment_rotation: true
  fragment_pose_translation: 0.7

model:
  encoder: {type: "se3_invariant", embedding_dim: 128, hidden_dim: 192, num_tokens: 16, num_neighbors: 16, dropout: 0.05}
  compatibility: {hidden_dims: [256, 192], edge_dim: 128, dropout: 0.05}
  assembly: {gnn_hidden_dim: 256, gnn_layers: 3, transformer_layers: 2, transformer_heads: 4, decoder_layers: 4, output_points: 5000, dropout: 0.05, disable_compatibility: false}
  pose: {architecture: "target_segmentation", hidden_dim: 256, num_heads: 4, cross_attention_layers: 2, transformer_layers: 2, dropout: 0.05, freeze_encoders: true}

loss:
  stage1: {lambda_contrast: 0.5, temperature: 0.07, pos_weight: 1.0, lambda_boundary: 1.0}
  stage2: {lambda_boundary: 2.0, lambda_coverage: 1.0, lambda_dropout: 0.5, lambda_consistency: 0.3, lambda_compat: 0.1, boundary_weight: 2.0, dropout_margin: 0.01}
  stage3: {lambda_segmentation: 2.0, lambda_matching: 2.0, lambda_align: 5.0, lambda_correspondence: 1.0, lambda_recon: 1.0, lambda_coverage: 1.0, lambda_gt: 1.0, lambda_overlap: 0.1, lambda_pose: 2.0, overlap_threshold: 0.03, segmentation_outlier_threshold: 0.08}

stage1: {epochs: 50, epoch_size: 20000, batch_size: 8, num_workers: 4, learning_rate: 0.0001, weight_decay: 0.0001, gradient_clip: 1.0}
stage2: {epochs: 80, epoch_size: 10000, batch_size: 1, num_workers: 4, learning_rate: 0.0001, pretrained_learning_rate: 0.00001, weight_decay: 0.0001, gradient_clip: 1.0, freeze_pretrained: true, unfreeze_pretrained_epoch: 20, validation_interval: 10, validation_max_samples: 0}
stage3:
  epochs: 30
  epoch_size: 1024
  batch_size: 1
  grad_accum_steps: 4
  num_workers: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip: 1.0
  pose_only_epochs: 0
  geometry_epochs: 10
  initialization_icp_iterations: 0
  target_feature_points: 512
  geometry_loss_points: 2048
  gauge_aware: false
  registration_max_residual: 0.02
  global_registration: {method: "auto", voxel: 0.05, icp_inits: 8, icp_iterations: 12, source_points: 512, target_points: 1024}

evaluation: {max_samples: 0}
output: {dir: "./outputs_partnet_gpat"}
