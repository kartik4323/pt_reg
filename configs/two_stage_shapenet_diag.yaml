# Stage-3 DIAGNOSTIC config.
#
# Purpose: cheaply test the new direct-correspondence loss on real ShapeNet
# BEFORE committing to the full Stage-2 capacity-bump retrain. It keeps the
# ORIGINAL capacity (encoder.num_tokens=16, assembly.decoder_layers=2) so the
# existing stage1_pretrained.pt / stage2_assembly.pt still load, and writes to a
# separate output dir so it never clobbers the real run.
#
# Use only for `--mode stage3-train-gt` / `stage3-gt` with
# --stage2-checkpoint outputs_two_stage_shapenet/stage2_assembly.pt

mock_data:
  enabled: false

data:
  shapenet_root: "./shape_processed"
  categories:
    - "02691156" # airplane
    - "02828884" # bench
    - "02933112" # cabinet
    - "02958343" # car
    - "03001627" # chair
    - "03211117" # display
    - "03636649" # lamp
    - "03691459" # speaker
    - "04256520" # sofa
    - "04379243" # table
  num_points_per_object: 4096
  num_points_per_fragment: 1024
  train_split: 0.80
  val_split: 0.10
  test_split: 0.10
  seed: 42

fragment:
  min_fragments: 3
  max_fragments: 6
  strategies: ["plane", "voronoi", "irregular"]
  boundary_eps: 0.04
  irregular_noise_scale: 0.05

pairs:
  positive_ratio: 0.5
  easy_negative_ratio: 0.2
  hard_negative_ratio: 0.2
  perturbed_positive_ratio: 0.1
  perturb_jitter_std: 0.03
  perturb_anisotropic_scale: 0.12

augmentation:
  random_fragment_rotation: true
  fragment_pose_translation: 0.7

model:
  encoder:
    type: "se3_invariant"
    embedding_dim: 128
    hidden_dim: 192
    num_tokens: 16       # ORIGINAL — matches existing checkpoints
    num_neighbors: 16
    dropout: 0.05
  compatibility:
    hidden_dims: [256, 192]
    edge_dim: 128
    dropout: 0.05
  assembly:
    gnn_hidden_dim: 256
    gnn_layers: 3
    transformer_layers: 2
    transformer_heads: 4
    decoder_layers: 2    # ORIGINAL — must match existing stage2_assembly.pt
    output_points: 4096
    dropout: 0.05
  pose:
    architecture: "target_segmentation"
    hidden_dim: 256
    num_heads: 4
    cross_attention_layers: 2
    transformer_layers: 2
    dropout: 0.05
    freeze_encoders: true

loss:
  stage1:
    lambda_contrast: 0.5
    temperature: 0.07
    pos_weight: 1.0
    lambda_boundary: 0.0
  stage2:
    lambda_boundary: 2.0
    lambda_coverage: 1.0
    lambda_dropout: 0.5
    lambda_consistency: 0.3
    lambda_compat: 0.1
    boundary_weight: 2.0
    dropout_margin: 0.01
  stage3:
    lambda_segmentation: 2.0
    lambda_matching: 2.0
    lambda_matching_early: 4.0
    lambda_matching_mid: 2.0
    lambda_matching_late: 1.0
    # The fix under test: direct correspondence supervision.
    lambda_correspondence: 3.0
    lambda_correspondence_early: 4.0
    lambda_recon: 1.0
    lambda_coverage: 1.0
    lambda_gt: 1.0
    lambda_overlap: 0.1
    lambda_pose: 2.0
    overlap_threshold: 0.03
    segmentation_outlier_threshold: 0.08

stage1:
  epochs: 50
  epoch_size: 20000
  batch_size: 16
  num_workers: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip: 1.0

stage2:
  epochs: 80
  epoch_size: 10000
  batch_size: 4
  num_workers: 4
  learning_rate: 0.0001
  pretrained_learning_rate: 0.00001
  weight_decay: 0.0001
  gradient_clip: 1.0
  freeze_pretrained: true
  unfreeze_pretrained_epoch: 20

stage3:
  epochs: 30
  epoch_size: 1024
  batch_size: 1        # 24 GB card: batch>1 OOMs (see main config note)
  grad_accum_steps: 4  # effective batch 4 at batch-1 memory
  num_workers: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip: 1.0
  pose_only_epochs: 0
  geometry_epochs: 10
  initialization_icp_iterations: 0
  icp_iterations: 0

output:
  dir: "./outputs_stage3_diag"
